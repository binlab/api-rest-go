environment:
  defaultServices:
    - name: "api-rest-go"
            
services:
  - name: 'api-rest-go'
    github:
      repository: 'binlab/api-rest-go'
      branchName: 'master'
      docker:
        builder:
          engine: "buildkit"
        defaultTag: "master"
        app:
          dockerfilePath: 'sysops/dockerfiles/app.Dockerfile'
          env:
            PORT: "8080"
            SECRET-TEXT: "{{barbican:75ab4164-5e70-4f1e-9008-eda0f5525d3c}}"
            SECRET-JSON: "{{barbican:5326e552-6572-4a07-8851-2f1144a0efbf:password}}"
          ports:
            - 8080
      deployment:
        public: true
        capacityType: "SPOT"
        resource:
          cpu:
            request: "10m"
          memory:
            request: "100Mi"
        readiness:
          tcpSocketPort: 8080
          httpGet:
            port: 80
